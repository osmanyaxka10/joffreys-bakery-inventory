<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joffrey's Bakery — ERP Invoices</title><style>
:root{--ink:#172033;--muted:#667085;--line:#cfd5dd;--soft:#f3f5f7}*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:var(--ink);font:12px Arial,Helvetica,sans-serif}.screen{max-width:1200px;margin:auto;padding:16px}.toolbar{background:#fff;border:1px solid var(--line);padding:12px;border-radius:10px;display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:12px}label{display:grid;gap:4px;font-weight:700;font-size:11px}input,select,button{font:inherit}input,select{padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}.btn{padding:9px 13px;border:1px solid #111827;border-radius:6px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.status{color:var(--muted);margin:8px 0}.error{color:#b42318}.print-area{display:grid;gap:12px}.cover,.invoice{background:#fff;padding:10mm;border:1px solid var(--line)}.cover{break-after:page}.title{display:flex;justify-content:space-between;border-bottom:2px solid #111827;padding-bottom:7px;margin-bottom:8px}.title h1{font-size:17px;margin:0}.small{font-size:9px;color:var(--muted)}.group{margin:10px 0 14px;break-inside:avoid}.group-head{background:var(--soft);border:1px solid var(--line);padding:6px;font-weight:700;display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse;font-size:8.5px}th,td{border:1px solid var(--line);padding:4px 5px;vertical-align:top}th{background:#1f2937;color:#fff;font-size:7.5px;text-transform:uppercase}.num{text-align:right}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:7px 0}.box{border:1px solid var(--line);background:#fafbfc;padding:5px}.box span{display:block;font-size:7px;color:var(--muted);text-transform:uppercase;font-weight:700}.box strong{font-size:9.5px}.invoice{break-before:page;min-height:267mm}.invoice thead{display:table-header-group}.invoice tr{break-inside:avoid}.invoice .doc-head{background:#fff;color:#172033;text-transform:none;text-align:left;font-size:9px}.total td{font-weight:800;background:var(--soft)}.audit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px;font-size:8px}.audit div{border:1px solid var(--line);padding:6px;min-height:30px}.note{font-size:7.5px;color:var(--muted);margin-top:6px}@page{size:A4 portrait;margin:8mm}@media print{body{background:#fff}.screen{max-width:none;padding:0}.toolbar,.screen-only{display:none!important}.cover,.invoice{border:0;padding:0;box-shadow:none}.cover{page-break-after:always}.invoice{page-break-before:always}table{font-size:7.5pt}th,td{padding:1.4mm 1.6mm}.invoice thead{display:table-header-group}.invoice tr{page-break-inside:avoid}}@media(max-width:700px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .wide{grid-column:1/-1}.meta,.audit{grid-template-columns:1fr 1fr}}
</style></head><body><main class="screen">
<section class="toolbar"><label class="wide">Document Type<select id="type"><option value="transfer">Transfer Invoice</option><option value="receiving">Receiving Invoice</option></select></label><label>From Date<input id="from" type="date" value="2026-09-01"></label><label>To Date<input id="to" type="date" value="2026-09-27"></label><button id="go" class="btn">Generate</button></section>
<div id="status" class="screen-only status">Live data will be loaded from the Joffrey's Supabase inventory.</div><div id="printArea" class="print-area"><div class="screen-only">Choose dates and Generate.</div></div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://ivqygskesdrretwgouea.supabase.co','sb_publishable_f4Jv-1y826TQkpRbVYAeEg_91xKWGSx',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),num=v=>Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2}),df=v=>{if(!v)return'—';const[a,b,c]=String(v).slice(0,10).split('-');return c+'/'+b+'/'+a},tf=v=>v?new Date(v).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'}):'—';
function docs(rows,type){const m=new Map();for(const r of rows){const id=type==='transfer'?(r.transfer_id??r.reference_no):(r.receiving_id??r.reference_no);if(!m.has(id))m.set(id,{id,date:r.date,rows:[],group:type==='transfer'?(r.from_branch||'BAKERY JEDDAH'):(r.supplier_name||'—')});m.get(id).rows.push(r)}return[...m.values()].sort((a,b)=>a.date.localeCompare(b.date)||a.group.localeCompare(b.group)||String(a.id).localeCompare(String(b.id)))}
function groups(ds){const m=new Map();for(const d of ds){const k=d.date+'|'+d.group;if(!m.has(k))m.set(k,{date:d.date,group:d.group,docs:[]});m.get(k).docs.push(d)}return[...m.values()]}
function cover(gs,type){return'<section class="cover"><div class="title"><div><h1>JOFFREY’S BAKERY JEDDAH</h1><div class="small">'+(type==='transfer'?'TRANSFER INVOICE SUMMARY':'RECEIVING INVOICE SUMMARY')+'</div></div><div class="small">Grouped by date and '+(type==='transfer'?'From Cost Center':'Vendor')+'</div></div>'+gs.map(g=>'<div class="group"><div class="group-head"><span>'+df(g.date)+' · '+esc(g.group)+'</span><span>'+g.docs.length+' document(s)</span></div><table><thead><tr><th>#</th><th>Document</th><th>Status</th><th>Date</th><th>From / Vendor</th><th>To / Cost Center</th><th>Lines</th><th>Units</th></tr></thead><tbody>'+g.docs.map((d,i)=>{const r=d.rows[0],u=d.rows.reduce((a,x)=>a+Number(x.quantity||0),0);return'<tr><td>'+(i+1)+'</td><td>'+esc(r.reference_no||'—')+'</td><td>'+(type==='transfer'?'Delivered':'Received')+'</td><td>'+df(r.date)+'</td><td>'+esc(type==='transfer'?(r.from_branch||'BAKERY JEDDAH'):(r.supplier_name||'—'))+'</td><td>'+esc(type==='transfer'?(r.to_branch||'—'):(r.branch_name||'BAKERY WAREHOUSE'))+'</td><td>'+d.rows.length+'</td><td class="num">'+num(u)+'</td></tr>'}).join('')+'</tbody></table></div>').join('')+'</section>'}
function invoice(d,type){const r=d.rows[0],transfer=type==='transfer',ref=r.reference_no||(transfer?'TR'+String(r.transfer_id).padStart(6,'0'):'REC-'+String(r.receiving_id).padStart(6,'0')),total=d.rows.reduce((a,x)=>a+Number(x.quantity||0),0),value=d.rows.reduce((a,x)=>a+Number(transfer?x.total_value:x.total_cost||0),0),from=transfer?(r.from_branch||'BAKERY JEDDAH'):(r.supplier_name||'—'),to=transfer?(r.to_branch||'—'):(r.branch_name||'BAKERY WAREHOUSE'),prepared=r.performed_by||'—';return'<article class="invoice"><div class="title"><div><h1>JOFFREY’S BAKERY JEDDAH</h1><div class="small">'+(transfer?'INVENTORY TRANSFER INVOICE':'INVENTORY RECEIVING INVOICE')+'</div></div><div><b>'+esc(ref)+'</b><div class="small">Status: '+(transfer?'Delivered':'Received')+'</div></div></div><div class="meta"><div class="box"><span>Document No.</span><strong>'+esc(ref)+'</strong></div><div class="box"><span>Status</span><strong>'+(transfer?'Delivered':'Received')+'</strong></div><div class="box"><span>'+ (transfer?'Delivery':'Receiving') +' Date</span><strong>'+df(r.date)+'</strong></div><div class="box"><span>'+ (transfer?'From Cost Center':'Vendor / Supplier')+'</span><strong>'+esc(from)+'</strong></div><div class="box"><span>'+ (transfer?'To Cost Center':'Receiving Cost Center')+'</span><strong>'+esc(to)+'</strong></div><div class="box"><span>Total Qty</span><strong>'+num(total)+' PCS</strong></div></div><table><thead><tr><th class="doc-head" colspan="'+(transfer?8:9)+'">'+(transfer?'Transfer':'Receiving')+': '+esc(ref)+' · Date: '+df(r.date)+' · '+(transfer?'From: '+esc(from)+' · To: '+esc(to):'Vendor: '+esc(from)+' · Cost Center: '+esc(to))+'</th></tr><tr><th>#</th><th>Item Code</th><th>Item Name (Article)</th><th>Unit</th><th class="num">Qty</th><th class="num">Requested Qty</th><th class="num">Unit Cost</th><th class="num">Value</th>'+(transfer?'':'<th>Expiry</th>')+'</tr></thead><tbody>'+d.rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.product_code||'—')+'</td><td>'+esc(x.product_name||'—')+'</td><td>'+esc(x.unit||'PCS')+'</td><td class="num">'+num(x.quantity)+'</td><td class="num">'+num(x.requested_quantity??x.quantity)+'</td><td class="num">'+num(x.unit_cost)+'</td><td class="num">'+num(transfer?x.total_value:x.total_cost)+'</td>'+(transfer?'':'<td>'+df(x.expiry_date)+'</td>')+'</tr>').join('')+'</tbody><tfoot><tr class="total"><td colspan="4">TOTAL</td><td class="num">'+num(total)+'</td><td class="num">'+num(d.rows.reduce((a,x)=>a+Number(x.requested_quantity??x.quantity),0))+'</td><td></td><td class="num">'+num(value)+'</td>'+(transfer?'':'<td></td>')+'</tr></tfoot></table><div class="audit"><div><b>Prepared by</b><br>'+esc(prepared)+'</div><div><b>Changed by</b><br>'+esc(prepared)+'</div><div><b>Changed At</b><br>'+esc(tf(r.created_at))+'</div></div><div class="note">Requested Qty falls back to Qty because the current inventory data source does not expose a separate requested-quantity field. The document header is repeated by the table header on continuation pages.</div></article>'}
async function load(){const b=$('#go'),s=$('#status'),a=$('#printArea');b.disabled=true;s.className='screen-only status';s.textContent='Loading…';a.innerHTML='';try{const type=$('#type').value,from=$('#from').value,to=$('#to').value;if(!from||!to||from>to)throw Error('Choose a valid date range.');const view=type==='transfer'?'v_daily_transfer_report':'v_daily_receiving_report';const{data,error}=await db.from(view).select('*').gte('date',from).lte('date',to).order('date').order('created_at');if(error)throw error;const ds=docs(data||[],type);if(!ds.length){a.innerHTML='<div>No records found.</div>';s.textContent='';return}a.innerHTML=cover(groups(ds),type)+ds.map(d=>invoice(d,type)).join('');s.textContent=ds.length+' document(s) generated. Use the browser Print → Save as PDF.'}catch(e){s.className='screen-only status error';s.textContent=e.message||String(e)}finally{b.disabled=false}}
$('#go').onclick=load;
</script></body></html>
