<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joffrey’s Bakery — Transfer Invoices</title><style>
:root{--ink:#172033;--muted:#667085;--line:#cfd5dd;--soft:#f3f5f7}*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:var(--ink);font:12px Arial,Helvetica,sans-serif}.screen{max-width:1200px;margin:auto;padding:16px}.toolbar{background:#fff;border:1px solid var(--line);padding:12px;border-radius:10px;display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:12px}label{display:grid;gap:4px;font-weight:700;font-size:11px}input,select,button{font:inherit}input,select{padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}.btn{padding:9px 13px;border:1px solid #111827;border-radius:6px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.status{color:var(--muted);margin:8px 0}.error{color:#b42318}.print-area{display:grid;gap:12px}.cover,.invoice,.receiving-day{background:#fff;padding:10mm;border:1px solid var(--line)}.cover{break-after:page}.title{display:flex;justify-content:space-between;border-bottom:2px solid #111827;padding-bottom:7px;margin-bottom:8px}.title h1{font-size:17px;margin:0}.small{font-size:9px;color:var(--muted)}.group{margin:10px 0 14px;break-inside:avoid}.group-head{background:var(--soft);border:1px solid var(--line);padding:6px;font-weight:700;display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse;font-size:8.5px}th,td{border:1px solid var(--line);padding:4px 5px;vertical-align:top}th{background:#1f2937;color:#fff;font-size:7.5px;text-transform:uppercase}.num{text-align:right}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:7px 0}.box{border:1px solid var(--line);background:#fafbfc;padding:5px}.box span{display:block;font-size:7px;color:var(--muted);text-transform:uppercase;font-weight:700}.box strong{font-size:9.5px}.invoice{break-before:page;min-height:267mm}.invoice thead{display:table-header-group}.invoice tr{break-inside:avoid}.invoice .doc-head{background:#fff;color:#172033;text-transform:none;text-align:left;font-size:9px}.total td{font-weight:800;background:var(--soft)}.totals{margin-left:auto;width:320px;border-collapse:collapse;margin-top:10px}.audit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px;font-size:8px}.audit div{border:1px solid var(--line);padding:6px;min-height:30px}.note{font-size:7.5px;color:var(--muted);margin-top:6px}.receiving-day{width:430pt;margin:0 auto;padding:0;border:0;background:#fff}.receiving-day h1{font-size:16pt;margin:0 0 5pt;font-weight:700}.receiving-meta{font-size:9.5pt;color:#596777;margin-bottom:17pt}.receiving-invoice{break-inside:avoid;margin-bottom:20pt}.receiving-invoice-title{font-size:10.5pt;color:#164b5d;font-weight:700;margin-bottom:3pt}.receiving-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt}.receiving-table th{background:#1f4e5f;color:#fff;font-size:9pt;text-transform:none;font-weight:700;text-align:left;padding:2.5pt 1.5pt;border:0;white-space:nowrap}.receiving-table td{border:1px solid #d9dde1;padding:2.3pt 1.5pt;line-height:1.08;vertical-align:middle}.receiving-table th:nth-child(1),.receiving-table td:nth-child(1){width:72pt}.receiving-table th:nth-child(2),.receiving-table td:nth-child(2){width:155pt}.receiving-table th:nth-child(3),.receiving-table td:nth-child(3){width:39pt}.receiving-table th:nth-child(4),.receiving-table td:nth-child(4){width:56pt}.receiving-table th:nth-child(5),.receiving-table td:nth-child(5){width:61pt}.receiving-table .right{text-align:right}.receiving-subtotal{font-weight:700;font-size:10pt;margin-top:4pt;display:grid;grid-template-columns:1fr 39pt 117pt;column-gap:0}.receiving-subtotal .label{text-align:right}.receiving-subtotal .qty{text-align:right}.receiving-subtotal .value{text-align:right}.day-total{font-weight:700;font-size:10pt;margin-top:29pt;display:grid;grid-template-columns:1fr 39pt 117pt}.day-total .label{text-align:right}.day-total .qty{text-align:right}.day-total .value{text-align:right}.receiving-invoice.manual{margin-bottom:20pt}@page{size:Letter portrait;margin:0}@media print{body{background:#fff}.screen{max-width:none;padding:0}.toolbar,.screen-only{display:none!important}.cover,.invoice{border:0;padding:0;box-shadow:none}.cover{page-break-after:always}.invoice{page-break-before:always}.receiving-day{width:430pt;margin:0 auto;padding-top:31pt;page-break-after:always;page-break-before:always}.receiving-day:first-child{page-break-before:auto}.receiving-day h1{font-size:16pt}.receiving-meta{font-size:9.5pt}.receiving-table{font-size:9pt}.receiving-table th{font-size:9pt;padding:2.5pt 1.5pt}.receiving-table td{padding:2.3pt 1.5pt}.receiving-subtotal,.day-total{font-size:10pt}}@media(max-width:700px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .wide{grid-column:1/-1}.meta,.audit{grid-template-columns:1fr 1fr}}
</style></head><body><main class="screen">
<section class="toolbar"><label>Document Type<select id="type"><option value="transfer">Transfer Invoices</option><option value="receiving">Receiving Invoices</option></select></label><label>From Date<input id="from" type="date"></label><label>To Date<input id="to" type="date"></label><button id="go" class="btn">Generate</button><button id="print" class="btn" type="button">Print / Save PDF</button><button id="back" class="btn" type="button">Back to Inventory</button></section>
<div id="status" class="screen-only status">Live data will be loaded from the Joffrey's Supabase inventory.</div><div id="printArea" class="print-area"><div class="screen-only">Choose dates and Generate.</div></div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://ivqygskesdrretwgouea.supabase.co','sb_publishable_f4Jv-1y826TQkpRbVYAeEg_91xKWGSx',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),num=v=>Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),qty=v=>Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2}),df=v=>{if(!v)return'—';const[a,b,c]=String(v).slice(0,10).split('-');return c+'/'+b+'/'+a};
function money(v){return'SAR '+num(v)}
function defaults(){const d=new Date(),to=d.toISOString().slice(0,10),f=new Date(d);f.setDate(f.getDate()-30);$('#from').value=f.toISOString().slice(0,10);$('#to').value=to}
function transferInvoice(inv,ls){
 return '<article class="invoice"><div class="title"><div><h1>JOFFREY’S BAKERY JEDDAH</h1><div class="small">Bakery Inventory Management System</div></div><div style="text-align:right"><h1>Tax Invoice</h1><div class="small">TRANSFER INVOICE</div></div></div><div class="meta"><div class="box"><span>Invoice No.</span><strong>'+esc(inv.invoice_no||'—')+'</strong></div><div class="box"><span>Invoice Date</span><strong>'+df(inv.invoice_date)+'</strong></div><div class="box"><span>From Branch</span><strong>'+esc(inv.from_branch||'—')+'</strong></div><div class="box"><span>To Branch</span><strong>'+esc(inv.to_branch||'—')+'</strong></div><div class="box"><span>Total Quantity</span><strong>'+qty(inv.total_quantity)+'</strong></div><div class="box"><span>Currency / VAT</span><strong>SAR / 15%</strong></div></div><table><thead><tr><th>#</th><th>Code</th><th>Item</th><th>Unit</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Net</th><th class="num">VAT 15%</th><th class="num">Total</th></tr></thead><tbody>'+ls.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.item_code||'—')+'</td><td>'+esc(x.item_name||'—')+'</td><td>'+esc(x.unit||'PCS')+'</td><td class="num">'+qty(x.quantity)+'</td><td class="num">'+num(x.price)+'</td><td class="num">'+num(x.net)+'</td><td class="num">'+num(x.vat_amount)+'</td><td class="num">'+num(x.line_total)+'</td></tr>').join('')+'</tbody></table><table class="totals"><tr><td>Subtotal</td><td class="num">'+money(inv.subtotal)+'</td></tr><tr><td>VAT 15%</td><td class="num">'+money(inv.vat_total)+'</td></tr><tr class="total"><td>Grand Total</td><td class="num">'+money(inv.grand_total)+'</td></tr><tr class="total"><td>Total Quantity</td><td class="num">'+qty(inv.total_quantity)+'</td></tr></table><div class="audit"><div><b>Received By</b><br><br>Signature</div><div><b>Seller / Issued By</b><br><br>Signature</div><div><b>Currency</b><br>SAR · VAT 15%</div></div><div class="note">Transfer document generated from v_transfer_invoices and v_transfer_invoice_lines.</div></article>';
}
function receivingDay(date,docs){
 const supplierSet=[...new Set(docs.map(d=>d.supplier_name).filter(Boolean))];
 const supplier=supplierSet.length===1?supplierSet[0]:(supplierSet.length?supplierSet.join(', '):'—');
 const parts=docs.map(d=>{
  const inv=esc(d.invoice_no||d.reference_no||('REC-'+String(d.id).padStart(6,'0')));
  const manual=!d.invoice_no;
  const label='Invoice '+inv+(manual?' (manual order, no invoice)':'');
  const totalQty=d.rows.reduce((a,x)=>a+Number(x.quantity||0),0);
  const subtotal=d.rows.reduce((a,x)=>a+Number(x.total_cost||0),0);
  return '<section class="receiving-invoice'+(manual?' manual':'')+'"><div class="receiving-invoice-title">'+label+'</div><table class="receiving-table"><thead><tr><th>Product Code</th><th>Product Name</th><th>Qty</th><th>Unit Cost (SAR)</th><th>Value (SAR)</th></tr></thead><tbody>'+
   d.rows.map(x=>'<tr><td>'+esc(x.product_code||'—')+'</td><td>'+esc(x.product_name||'—')+'</td><td class="right">'+qty(x.quantity)+'</td><td class="right">'+num(x.unit_cost)+'</td><td class="right">'+num(x.total_cost)+'</td></tr>').join('')+
   '</tbody></table><div class="receiving-subtotal"><div class="label">Subtotal — '+inv+'</div><div class="qty">'+qty(totalQty)+'</div><div class="value">'+num(subtotal)+'</div></div></section>';
 });
 const dayQty=docs.reduce((a,d)=>a+d.rows.reduce((b,x)=>b+Number(x.quantity||0),0),0);
 const dayValue=docs.reduce((a,d)=>a+d.rows.reduce((b,x)=>b+Number(x.total_cost||0),0),0);
 return '<article class="receiving-day"><h1>Joffrey\'s Bakery Jeddah — Receiving</h1><div class="receiving-meta">Date received: '+df(date)+'&nbsp;&nbsp;&nbsp; Supplier: '+esc(supplier)+'&nbsp;&nbsp;&nbsp; Invoices: '+docs.length+'</div>'+parts.join('')+'<div class="day-total"><div class="label">DAY TOTAL (all invoices)</div><div class="qty">'+qty(dayQty)+'</div><div class="value">'+num(dayValue)+'</div></div></article>';
}
async function load(){
 const go=$('#go'),s=$('#status'),a=$('#printArea');
 go.disabled=true;s.textContent='Loading…';s.className='screen-only status';
 try{
  const type=$('#type').value,from=$('#from').value,to=$('#to').value;
  if(!from||!to||from>to)throw Error('Choose a valid date range.');
  const{data:{session}}=await db.auth.getSession();if(!session){location.href='./index.html';return}
  if(type==='transfer'){
   const{data:invoices,error}=await db.from('v_transfer_invoices').select('transfer_id,invoice_no,invoice_date,from_branch_id,from_branch,to_branch_id,to_branch,line_count,total_quantity,subtotal,vat_total,grand_total').gte('invoice_date',from).lte('invoice_date',to).order('invoice_date',{ascending:false}).order('invoice_no',{ascending:false});
   if(error)throw error;
   const ids=(invoices||[]).map(x=>x.transfer_id);let lines=[];
   if(ids.length){const q=await db.from('v_transfer_invoice_lines').select('transfer_id,invoice_no,invoice_date,from_branch,to_branch,line_no,item_code,item_name,unit,quantity,price,net,vat_rate,vat_amount,line_total').in('transfer_id',ids).order('transfer_id').order('line_no');if(q.error)throw q.error;lines=q.data||[]}
   const by=new Map();for(const x of lines){const k=String(x.transfer_id);if(!by.has(k))by.set(k,[]);by.get(k).push(x)}
   if(!invoices?.length){a.innerHTML='<div>No transfer invoices found for the selected period.</div>';s.textContent='';return}
   a.innerHTML=(invoices||[]).map(inv=>transferInvoice(inv,by.get(String(inv.transfer_id))||[])).join('');
   s.textContent=invoices.length+' transfer invoice(s) generated.';
  }else{
   const{data,error}=await db.from('v_daily_receiving_report').select('*').gte('date',from).lte('date',to).order('date',{ascending:false}).order('created_at',{ascending:false});
   if(error)throw error;
   const rows=data||[],docs=new Map();
   for(const x of rows){
    const id=String(x.receiving_id??x.reference_no??x.date);
    if(!docs.has(id))docs.set(id,{id,date:x.date,reference_no:x.reference_no,invoice_no:x.invoice_no,supplier_name:x.supplier_name,branch_name:x.branch_name,performed_by:x.performed_by,created_at:x.created_at,rows:[]});
    const d=docs.get(id);
    if(x.invoice_no && !d.invoice_no)d.invoice_no=x.invoice_no;
    d.rows.push(x);
   }
   const byDate=new Map();
   for(const d of docs.values()){
    const k=String(d.date);
    if(!byDate.has(k))byDate.set(k,[]);
    byDate.get(k).push(d);
   }
   const dates=[...byDate.keys()].sort((a,b)=>b.localeCompare(a));
   if(!dates.length){a.innerHTML='<div>No receiving invoices found for the selected period.</div>';s.textContent='';return}
   a.innerHTML=dates.map(date=>receivingDay(date,byDate.get(date))).join('');
   s.textContent=docs.size+' receiving invoice(s) generated across '+dates.length+' day(s).';
  }
 }catch(e){s.className='screen-only status error';s.textContent=e.message||String(e)}
 finally{go.disabled=false}
}$('#go').onclick=load;$('#print').onclick=()=>window.print();$('#back').onclick=()=>location.href='./index.html';defaults();(async()=>{const{data:{session}}=await db.auth.getSession();if(!session){location.href='./index.html';return}await load()})();db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||!session)location.href='./index.html'});
</script></body></html>
