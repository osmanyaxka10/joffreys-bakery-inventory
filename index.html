<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="JOFFREY’S BAKERY JEDDAH — Bakery Inventory Management System" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=20261015-3" />
  <link rel="stylesheet" href="./theme.css?v=20261015-3" />
  <title>JOFFREY’S BAKERY JEDDAH — Inventory</title>
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <section id="authView" class="auth-shell">
    <div class="auth-card">
      <div class="brand-lockup">
        <div class="brand-mark">J</div>
        <div>
          <h1>JOFFREY’S BAKERY JEDDAH</h1>
          <p>Bakery Inventory Management System</p>
        </div>
      </div>
      <form id="loginForm" class="stack">
        <label>Email<input id="loginEmail" type="email" autocomplete="email" required placeholder="name@example.com" /></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••" /></label>
        <button class="btn primary wide" type="submit">Sign in</button>
      </form>
      <p id="loginStatus" class="small hidden" role="status" aria-live="polite"></p>
      <button id="resetPasswordBtn" class="link-btn" type="button">Send password reset email</button>
      <p class="small muted">Authorized bakery users only.</p>
    </div>
  </section>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand-lockup compact">
        <div class="brand-mark">J</div>
        <div class="brand-text">
          <strong>JOFFREY’S BAKERY JEDDAH</strong>
          <span>Inventory Management System</span>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <div id="userCard" class="user-card"></div>
        <button id="logoutBtn" class="btn ghost wide">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn mobile-only" aria-label="Open menu">☰</button>
        <div>
          <div id="crumb" class="crumb"></div>
          <h2 id="pageTitle">Dashboard</h2>
          <p id="pageSubtitle" class="muted">Live bakery operations</p>
        </div>
        <div class="topbar-actions">
          <button id="quickRecv" class="btn primary quick-btn" type="button" title="New Receiving" aria-label="New Receiving"><span>＋</span><b>Receiving</b></button>
          <button id="quickTr" class="btn quick-btn" type="button" title="New Transfer" aria-label="New Transfer"><span>⇄</span><b>Transfer</b></button>
          <button id="printDaily" class="btn ghost quick-btn" type="button" title="Print daily report" aria-label="Print daily report"><span>🖨</span><b>Daily Report</b></button>
          <button id="searchBtn" class="btn ghost search-btn" type="button" aria-label="Quick search">🔍 <span>Search</span> <kbd>Ctrl K</kbd></button>
          <button id="refreshBtn" class="btn ghost quick-btn" type="button" title="Refresh" aria-label="Refresh"><span>↻</span><b>Refresh</b></button>
        </div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="cmdk" class="cmdk hidden" role="dialog" aria-label="Quick search">
    <div class="cmdk-card">
      <input id="cmdkInput" placeholder="Search pages, actions or products…" autocomplete="off" />
      <div id="cmdkList" class="cmdk-list"></div>
      <div class="cmdk-foot"><span>↑↓ navigate</span><span>Enter open</span><span>Esc close</span></div>
    </div>
  </div>

  <dialog id="modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h3 id="modalTitle">Action</h3>
          <p id="modalSubtitle" class="muted"></p>
        </div>
        <button id="modalClose" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </dialog>

  <script>
    // Keep the installed PWA synchronized with the latest deployed app.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./sw.js?v=20261015-3', { updateViaCache: 'none' });
          await registration.update();
        } catch (error) {
          console.warn('PWA update check failed', error);
        }
      });

      let reloadedForController = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloadedForController) return;
        reloadedForController = true;
        window.location.reload();
      });
    }
  </script>
  <script type="module" src="./app.js?v=20261015-3"></script>
</body>
</html>
