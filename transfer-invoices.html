<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joffrey’s Bakery — Transfer Invoices</title><style>
:root{--ink:#172033;--muted:#667085;--line:#cfd5dd;--soft:#f3f5f7}*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:var(--ink);font:12px Arial,Helvetica,sans-serif}.screen{max-width:1200px;margin:auto;padding:16px}.toolbar{background:#fff;border:1px solid var(--line);padding:12px;border-radius:10px;display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:12px}label{display:grid;gap:4px;font-weight:700;font-size:11px}input,select,button{font:inherit}input,select{padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}.btn{padding:9px 13px;border:1px solid #111827;border-radius:6px;background:#111827;color:#fff;font-weight:700;cursor:pointer}.status{color:var(--muted);margin:8px 0}.error{color:#b42318}.print-area{display:grid;gap:12px}.cover,.invoice{background:#fff;padding:10mm;border:1px solid var(--line)}.cover{break-after:page}.title{display:flex;justify-content:space-between;border-bottom:2px solid #111827;padding-bottom:7px;margin-bottom:8px}.title h1{font-size:17px;margin:0}.small{font-size:9px;color:var(--muted)}.group{margin:10px 0 14px;break-inside:avoid}.group-head{background:var(--soft);border:1px solid var(--line);padding:6px;font-weight:700;display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse;font-size:8.5px}th,td{border:1px solid var(--line);padding:4px 5px;vertical-align:top}th{background:#1f2937;color:#fff;font-size:7.5px;text-transform:uppercase}.num{text-align:right}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:7px 0}.box{border:1px solid var(--line);background:#fafbfc;padding:5px}.box span{display:block;font-size:7px;color:var(--muted);text-transform:uppercase;font-weight:700}.box strong{font-size:9.5px}.invoice{break-before:page;min-height:267mm}.invoice thead{display:table-header-group}.invoice tr{break-inside:avoid}.invoice .doc-head{background:#fff;color:#172033;text-transform:none;text-align:left;font-size:9px}.total td{font-weight:800;background:var(--soft)}.audit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px;font-size:8px}.audit div{border:1px solid var(--line);padding:6px;min-height:30px}.note{font-size:7.5px;color:var(--muted);margin-top:6px}@page{size:A4 portrait;margin:8mm}@media print{body{background:#fff}.screen{max-width:none;padding:0}.toolbar,.screen-only{display:none!important}.cover,.invoice{border:0;padding:0;box-shadow:none}.cover{page-break-after:always}.invoice{page-break-before:always}table{font-size:7.5pt}th,td{padding:1.4mm 1.6mm}.invoice thead{display:table-header-group}.invoice tr{page-break-inside:avoid}}@media(max-width:700px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .wide{grid-column:1/-1}.meta,.audit{grid-template-columns:1fr 1fr}}
</style></head><body><main class="screen">
<section class="toolbar"><label>From Date<input id="from" type="date"></label><label>To Date<input id="to" type="date"></label><button id="go" class="btn">Generate</button><button id="print" class="btn" type="button">Print / Save PDF</button><button id="back" class="btn" type="button">Back to Inventory</button></section>
<div id="status" class="screen-only status">Live data will be loaded from the Joffrey's Supabase inventory.</div><div id="printArea" class="print-area"><div class="screen-only">Choose dates and Generate.</div></div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://ivqygskesdrretwgouea.supabase.co','sb_publishable_f4Jv-1y826TQkpRbVYAeEg_91xKWGSx',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),num=v=>Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),qty=v=>Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2}),df=v=>{if(!v)return'—';const[a,b,c]=String(v).slice(0,10).split('-');return c+'/'+b+'/'+a};
function money(v){return'SAR '+num(v)}
function defaults(){const d=new Date(),to=d.toISOString().slice(0,10),f=new Date(d);f.setDate(f.getDate()-30);$('#from').value=f.toISOString().slice(0,10);$('#to').value=to}
async function load(){const go=$('#go'),s=$('#status'),a=$('#printArea');go.disabled=true;s.textContent='Loading transfer invoices…';try{const{data:{session}}=await db.auth.getSession();if(!session){location.href='./index.html';return}const from=$('#from').value,to=$('#to').value;if(!from||!to||from>to)throw Error('Choose a valid date range.');const{data:invoices,error}=await db.from('v_transfer_invoices').select('transfer_id,invoice_no,invoice_date,from_branch_id,from_branch,to_branch_id,to_branch,line_count,total_quantity,subtotal,vat_total,grand_total').gte('invoice_date',from).lte('invoice_date',to).order('invoice_date',{ascending:false}).order('invoice_no',{ascending:false});if(error)throw error;const ids=(invoices||[]).map(x=>x.transfer_id);let lines=[];if(ids.length){const q=await db.from('v_transfer_invoice_lines').select('transfer_id,invoice_no,invoice_date,from_branch,to_branch,line_no,item_code,item_name,unit,quantity,price,net,vat_rate,vat_amount,line_total').in('transfer_id',ids).order('transfer_id').order('line_no');if(q.error)throw q.error;lines=q.data||[]}const by=new Map();for(const x of lines){const k=String(x.transfer_id);if(!by.has(k))by.set(k,[]);by.get(k).push(x)}if(!invoices?.length){a.innerHTML='<div>No transfer invoices found for the selected period.</div>';s.textContent='';return}s.textContent=(invoices.length)+' invoice(s) generated. Use Print / Save PDF.';a.innerHTML=invoices.map(inv=>{const ls=by.get(String(inv.transfer_id))||[];return'<article class="invoice"><div class="title"><div><h1>JOFFREY’S BAKERY JEDDAH</h1><div class="small">Bakery Inventory Management System</div></div><div><h1>Tax Invoice</h1><div class="small">TRANSFER INVOICE</div></div></div><div class="meta"><div class="box"><span>Invoice No.</span><strong>'+esc(inv.invoice_no||'—')+'</strong></div><div class="box"><span>Invoice Date</span><strong>'+df(inv.invoice_date)+'</strong></div><div class="box"><span>From Branch</span><strong>'+esc(inv.from_branch||'—')+'</strong></div><div class="box"><span>To Branch</span><strong>'+esc(inv.to_branch||'—')+'</strong></div><div class="box"><span>Total Quantity</span><strong>'+qty(inv.total_quantity)+'</strong></div></div><table><thead><tr><th>#</th><th>Code</th><th>Item</th><th>Unit</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Net</th><th class="num">VAT 15%</th><th class="num">Total</th></tr></thead><tbody>'+ls.map((x,i)=>'<tr><td>'+((i+1))+'</td><td>'+esc(x.item_code||'—')+'</td><td>'+esc(x.item_name||'—')+'</td><td>'+esc(x.unit||'PCS')+'</td><td class="num">'+qty(x.quantity)+'</td><td class="num">'+num(x.price)+'</td><td class="num">'+num(x.net)+'</td><td class="num">'+num(x.vat_amount)+'</td><td class="num">'+num(x.line_total)+'</td></tr>').join('')+'</tbody></table><table style="width:320px;margin-left:auto;margin-top:10px"><tr><td>Subtotal</td><td class="num">'+money(inv.subtotal)+'</td></tr><tr><td>VAT 15%</td><td class="num">'+money(inv.vat_total)+'</td></tr><tr class="total"><td>Grand Total</td><td class="num">'+money(inv.grand_total)+'</td></tr><tr class="total"><td>Total Quantity</td><td class="num">'+qty(inv.total_quantity)+'</td></tr></table><div class="audit"><div><b>Received By</b><br><br>Signature</div><div><b>Seller / Issued By</b><br><br>Signature</div><div><b>Currency</b><br>SAR · VAT 15%</div></div></article>'}).join('')}catch(e){s.className='screen-only status error';s.textContent=e.message||String(e)}finally{go.disabled=false}}
$('#go').onclick=load;$('#print').onclick=()=>window.print();$('#back').onclick=()=>location.href='./index.html';defaults();(async()=>{const{data:{session}}=await db.auth.getSession();if(!session){location.href='./index.html';return}await load()})();db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||!session)location.href='./index.html'});
</script></body></html>
